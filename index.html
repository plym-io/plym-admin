<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/favicon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Archivo/Space Grotesk are the admin's UI faces. The editor has two
         and only two: Merriweather for prose, Google Sans Code for markdown
         source and code. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Merriweather:ital,opsz,wght@0,18..144,300..800;1,18..144,300..800&family=Google+Sans+Code:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <title>plym - Admin</title>
    <!-- Theme before first paint. The store reaches the same answer a moment
         later, but a module bundle is far too late to decide the background
         colour — without this the panel flashes light on every load. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('plym.theme') || 'null');
          var pref = (saved && saved.state && saved.state.preference) || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
